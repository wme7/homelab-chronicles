[project]
name = "cluster"
version = "0.1.0"
description = "CLI to manage Raspberry Pi cluster nodes in parallel via SSH"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "parallel-ssh>=2.16.0.post1",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
]

[project.scripts]
cluster = "cluster.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cluster"]
